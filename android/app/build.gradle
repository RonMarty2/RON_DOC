apply plugin: 'com.android.application'

android {
    namespace = "bo.ronmartinez.aula"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "bo.ronmartinez.aula"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

/*
 * Compila el sitio y lo mete adentro de la app ANTES de empaquetarla.
 *
 * Sin esto había que acordarse de correr `npm run build:android` en una
 * terminal antes de apretar ▶, y si te olvidabas la app se instalaba con el
 * contenido viejo (o en blanco, en un clon nuevo) sin dar ningún error.
 *
 * Es "best effort" a propósito: si no encuentra Node, AVISA y sigue con el
 * contenido que ya estuviera copiado, en vez de romperte la compilación.
 * Para saltearlo del todo: ./gradlew assembleDebug -PsinSitioWeb
 */
tasks.register("construirSitioWeb") {
    description = "Compila el sitio web y lo copia dentro de la app"
    doLast {
        if (project.hasProperty("sinSitioWeb")) {
            println "[Aula] -PsinSitioWeb: se omite la compilación del sitio."
            return
        }
        def raizProyecto = rootProject.projectDir.parentFile
        def esWindows = System.getProperty("os.name").toLowerCase().contains("windows")
        def nodo = esWindows ? "node.exe" : "node"
        try {
            providers.exec {
                workingDir = raizProyecto
                commandLine nodo, "scripts/construir-android.mjs"
            }.standardOutput.asText.get().eachLine { println "[Aula] " + it }
            println "[Aula] Contenido de la app actualizado."
        } catch (Exception e) {
            println "[Aula] ---------------------------------------------------------------"
            println "[Aula] AVISO: no se pudo compilar el sitio automáticamente."
            println "[Aula] Motivo: " + e.message
            println "[Aula] Se va a instalar el contenido que ya estaba copiado."
            println "[Aula] Para actualizarlo a mano, abrí la Terminal de Android Studio"
            println "[Aula] (Alt+F12) y corré:   npm install  &&  npm run build:android"
            println "[Aula] ---------------------------------------------------------------"
        }
    }
}

preBuild.dependsOn "construirSitioWeb"

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
